<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ALUMNI MARBLE (Realtime Multiplayer)</title>
    <link rel=\"icon\" href=\"data:;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAA=\">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
    :root {
        --bg-top: #5b8cff;
        --bg-mid: #7b5cff;
        --bg-bottom: #4c35c7;

        --panel-dark: #1d2343;
        --panel-mid: #2b3464;
        --panel-light: #3a4686;

        --card: #eef4ff;
        --card-2: #dfe9ff;
        --line: rgba(255,255,255,0.18);

        --text-gold: #ffd269;
        --text-light: #f1f5f9;
        --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Noto Sans KR', sans-serif;
        background: linear-gradient(135deg, var(--bg-top), var(--bg-mid), var(--bg-bottom));
        color: var(--text-light);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        padding: 20px;
    }

    #gameContainer {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 1400px;
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid var(--line);
        border-radius: 24px;
        backdrop-filter: blur(16px);
        padding: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
    }
    header h1 {
        font-family: 'Montserrat', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(to right, #ffffff, var(--text-gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .header-btns { display: flex; gap: 10px; }
    .btn-reset {
        background: transparent;
        border: 1px solid rgba(239,68,68,0.5);
        color: #f87171;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
    }
    .btn-reset:hover { background: rgba(239,68,68,0.15); }

    #mainGameView {
        display: flex;
        gap: 24px;
        align-items: flex-start;
    }

    #boardWrapper {
        position: relative;
        flex: 1;
        background: var(--panel-dark);
        border: 2px solid var(--panel-mid);
        border-radius: 20px;
        padding: 16px;
        box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
    }

    #gameBoard {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(6, 1fr);
        gap: 6px;
        width: 100%;
        aspect-ratio: 10 / 6;
    }

    .cell {
        background: var(--panel-mid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .cell:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        background: var(--panel-light);
    }

    .cell-num { font-size: 9px; color: var(--text-muted); font-weight: 700; }
    .cell-title {
        font-size: 11px;
        font-weight: 700;
        text-align: center;
        word-break: keep-all;
        margin: auto 0;
        line-height: 1.3;
    }

    .cell.start { background: linear-gradient(135deg, #22c55e, #15803d); border-color: #4ade80; }
    .cell.start .cell-title { font-size: 14px; color: #fff; font-family: 'Montserrat'; }
    .cell.key { background: linear-gradient(135deg, #eab308, #a16207); border-color: #fde047; }
    .cell.key .cell-title { color: #fff; }
    .cell.corner { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-color: #60a5fa; }
    .cell.save { background: linear-gradient(135deg, #6366f1, #4338ca); border-color: #818cf8; }

    #controlPanel {
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .panel-card {
        background: var(--panel-dark);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .panel-card h3 {
        font-size: 14px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
    }

    #turnIndicator { text-align: center; }
    #turnEmoji { font-size: 36px; margin-bottom: 6px; animation: bounce 2s infinite; }
    #turnName { font-size: 20px; font-weight: 700; }

    #diceSection { text-align: center; }
    #diceResult {
        font-size: 64px;
        margin: 10px 0;
        cursor: default;
        transition: transform 0.1s;
    }
    .dice-rolling { animation: roll 0.1s infinite alternate; }

    .btn-roll {
        width: 100%;
        background: linear-gradient(to right, #f59e0b, #ef4444);
        color: #fff;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(239,68,68,0.4);
        transition: all 0.2s;
    }
    .btn-roll:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(239,68,68,0.6);
    }
    .btn-roll:disabled {
        background: #475569;
        color: #94a3b8;
        box-shadow: none;
        cursor: not-allowed;
    }

    #penaltyDisplay {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid var(--line);
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #penaltyDesc {
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
        color: #cbd5e1;
    }

    .btn-roulette-open {
        width: 100%;
        background: linear-gradient(to right, #a855f7, #6366f1);
        color: #fff;
        border: none;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .btn-roulette-open:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(99,102,241,0.5);
    }

    .player-token {
        position: absolute;
        width: 24px;
        height: 24px;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        pointer-events: none;
    }
    .player-token::after {
        content: attr(data-name);
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        background: rgba(15,23,42,0.8);
        color: #fff;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: nowrap;
        border: 1px solid rgba(255,255,255,0.2);
    }

    #setupModal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15,23,42,0.85);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .modal-content {
        background: var(--panel-dark);
        border: 2px solid var(--panel-mid);
        border-radius: 24px;
        padding: 32px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
        text-align: center;
    }
    .modal-content h2 {
        font-family: 'Montserrat', sans-serif;
        font-size: 24px;
        margin-bottom: 8px;
        color: #fff;
    }
    .modal-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .player-input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        background: var(--panel-mid);
        padding: 8px 12px;
        border-radius: 12px;
        align-items: center;
        border: 1px solid var(--line);
    }
    .player-input-row span { font-size: 12px; font-weight: 700; width: 50px; text-align: left; }
    .player-input-row input {
        flex: 1;
        background: rgba(15,23,42,0.4);
        border: 1px solid var(--line);
        padding: 6px 10px;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
    }
    .player-input-row input:focus { outline: 1px solid #6366f1; }
    .player-input-row select {
        background: rgba(15,23,42,0.4);
        border: 1px solid var(--line);
        color: #fff;
        padding: 6px;
        border-radius: 6px;
        font-size: 13px;
    }
    .btn-start {
        width: 100%;
        background: linear-gradient(to right, #3b82f6, #6366f1);
        color: #fff;
        border: none;
        padding: 12px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 16px;
        box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }
    .btn-start:hover { transform: translateY(-1px); }

    #rouletteView {
        display: none;
        grid-template-columns: 1fr 340px;
        gap: 24px;
        width: 100%;
    }
    .roulette-main {
        background: var(--panel-dark);
        border-radius: 20px;
        border: 1px solid var(--line);
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    .roulette-container {
        position: relative;
        width: 340px;
        height: 340px;
        margin: 20px 0;
    }
    #rouletteCanvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
    }
    .roulette-arrow {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 24px solid #ef4444;
        z-index: 20;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .roulette-sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    #rouletteResultPanel {
        text-align: center;
        font-size: 18px;
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30,41,59,0.6);
    }
    .roulette-config textarea {
        width: 100%;
        height: 80px;
        background: rgba(15,23,42,0.5);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #fff;
        padding: 10px;
        font-size: 12px;
        resize: none;
        margin-top: 6px;
        line-height: 1.5;
    }
    .btn-spin {
        width: 100%;
        background: linear-gradient(to right, #ec4899, #8b5cf6);
        color: #fff;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(236,72,153,0.4);
    }
    .btn-spin:disabled { background: #475569; color:#94a3b8; box-shadow:none; cursor:not-allowed; }
    .btn-close-roulette {
        width: 100%;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text-light);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
    }
    .btn-close-roulette:hover { background: rgba(255,255,255,0.05); }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    @keyframes roll {
        0% { transform: rotate(-8deg) scale(0.95); }
        100% { transform: rotate(8deg) scale(1.05); }
    }
    </style>
</head>
<body>

    <div id="setupModal">
        <div class="modal-content
