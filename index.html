<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ALUMNI MARBLE (Realtime Multiplayer)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: auto;
        }

        /* 10x6 보드판 */
        .board-container {
            display: grid;
            grid-template-columns: repeat(10, 115px);
            grid-template-rows: repeat(6, 105px);
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            position: relative;
        }

        .cell {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .cell.start { background: linear-gradient(135deg, #047857, #065f46); border: none; }
        .cell.corner { background-color: #111827; border-color: var(--accent-red); }
        .cell.save { background-color: #111827; border-color: var(--accent-green); }
        .cell.key { border-top: 4px solid var(--accent-gold); }

        .cell-num { font-family: 'Montserrat', sans-serif; font-size: 10px; color: #64748b; font-weight: 700; }
        .cell.start .cell-num, .cell.corner .cell-num { color: #94a3b8; }
        .cell-title { font-size: 13px; font-weight: 700; color: #ffffff; text-align: center; margin-top: 2px; line-height: 1.3; }

        /* 플레이어 레이어 */
        .token-area {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            min-height: 25px;
            justify-content: center;
            align-items: center;
        }

        .token {
            font-size: 24px;
            position: absolute;
            z-index: 20;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .token::after {
            content: attr(data-name);
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            border: 1px solid var(--border-color);
        }
        .token:hover::after { opacity: 1; }

        /* 중앙 패널 */
        .center-panel {
            grid-column: 2 / 10;
            grid-row: 2 / 6;
            background-color: rgba(15, 23, 42, 0.93);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border: 1px dashed #475569;
            z-index: 5;
            position: relative;
        }

        .game-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .game-subtitle {
            font-size: 11px;
            color: #64748b;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .turn-indicator {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            background-color: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-content-wrapper {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-game-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .log-box {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 15px;
        }

        .dice-val { 
            font-size: 45px; 
            margin-bottom: 5px;
            display: inline-block;
        }
        .dice-rolling {
            animation: roll 0.15s infinite linear;
        }
        @keyframes roll {
            0% { transform: translateY(0) rotate(0deg) scale(1.1); }
            50% { transform: translateY(-10px) rotate(180deg) scale(1.2); }
            100% { transform: translateY(0) rotate(360deg) scale(1.1); }
        }

        .penalty-text { font-size: 15px; color: #cbd5e1; line-height: 1.5; max-width: 600px; }

        .control-btns {
            display: flex;
            gap: 10px;
        }

        .roll-button {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s;
        }
        .roll-button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .util-button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        /* 룰렛 UI */
        .roulette-view {
            display: none;
            width: 100%;
            height: 100%;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: center;
            text-align: left;
        }

        .roulette-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto;
        }

        .roulette-pin {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--accent-red);
            z-index: 30;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        #rouletteCanvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6), 0 0 0 4px var(--border-color);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .roulette-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            justify-content: center;
        }

        .roulette-controls label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
        }

        .roulette-controls textarea {
            width: 100%;
            height: 65px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            color: white;
            font-size: 12px;
            resize: none;
        }

        .roulette-btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-spin {
            flex: 1;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-spin:disabled { background: #475569; cursor: not-allowed; }

        .btn-close-roulette {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        #rouletteResult {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-gold);
            text-align: center;
            min-height: 20px;
            background: rgba(255,255,255,0.05);
            padding: 6px;
            border-radius: 6px;
        }

        /* 방 리셋 버튼 */
        .reset-room-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: 1px solid #475569
